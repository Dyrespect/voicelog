<title>随身录录音中一屏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;600&family=IBM+Plex+Mono:wght@500;600&family=Caveat:wght@600&display=swap">
<style>
/* 布局：左边 2 倍像素放大，右边真实尺寸 */
:root{--bg:#ebe7df;--fg:#1d1a16;--muted:#6f685c;--panel:#f5f2ec;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151310;--fg:#ece5d7;--muted:#9c9282;--panel:#1e1b17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151310;--fg:#ece5d7;--muted:#9c9282;--panel:#1e1b17;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.75 "Noto Sans SC",system-ui,-apple-system,"PingFang SC",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:28px 60px}
h1{font:600 24px/1.3 "Noto Serif SC",serif;margin:0 0 6px}
.lede{color:var(--muted);max-width:66ch;margin:0 0 28px}
.row{display:flex;flex-wrap:wrap;gap:40px;padding:12px;align-items:flex-start}
canvas{display:block;image-rendering:pixelated}
#big{width:480px;height:480px;max-width:100%;border-radius:10px;box-shadow:0 0 0 12px rgba(214,222,228,.55),0 0 0 13px rgba(120,130,140,.45),0 18px 40px rgba(0,0,0,.22)}
figure{margin:0;display:flex;flex-direction:column;gap:12px}
#small{width:240px;height:240px;border-radius:8px;box-shadow:0 0 0 9px rgba(214,222,228,.55),0 0 0 10px rgba(120,130,140,.45)}
figcaption{font-size:13px;color:var(--muted)}
.knobs{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center;max-width:560px;margin:0 0 26px;padding:16px 18px;background:var(--panel);border-radius:8px}
.knobs label{font-size:14px;white-space:nowrap}
.knobs output{display:inline-block;min-width:2.2em;text-align:right;font:600 14px ui-monospace,Menlo,monospace;color:var(--fg)}
.knobs input{width:100%;accent-color:#bf582d}
.knobs input:focus-visible{outline:2px solid #bf582d;outline-offset:2px}
.knobs input:focus-visible{outline:2px solid #bf582d;outline-offset:2px}
.hint{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted)}
.ask{margin-top:34px;background:var(--panel);padding:18px 20px;border-radius:6px;max-width:72ch}
.ask p{margin:0}
@media (max-width:560px){#big{width:100%;height:auto;aspect-ratio:1}}
</style>
<div class="wrap">
  <h1>录音中这一屏 · 不加框</h1>
  <p class="lede">计数器和 VU 表不再装进框里，直接印在黑底上。质感靠零件自己：滚轮上下暗下去，数字像转进去；刻度后面一点琥珀背光，指针从暗处伸出来。</p>
  <div class="knobs">
    <label for="kd">质感 <output id="od">60</output></label>
    <input id="kd" type="range" min="0" max="100" value="60">
    <p class="hint">0 是纯平的字和线，往右滚轮和背光越明显。</p>
  </div>
  <div class="row">
    <canvas id="big" width="240" height="240" aria-label="放大两倍"></canvas>
    <figure><canvas id="small" width="240" height="240" aria-label="真实尺寸"></canvas><figcaption>真实尺寸</figcaption></figure>
  </div>
  <div class="ask"><p>还要改哪里直接说。定了我就按这个做其他状态，再写进板子。</p></div>
</div>
